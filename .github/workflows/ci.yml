name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache: false
      - name: Check and compile the standard-library application
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/daylight" .
          python3 -m py_compile scripts/package.py
          test "$(cat VERSION)" = "$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
      - name: Package and verify both architectures
        run: |
          python3 scripts/package.py
          (cd dist && sha256sum --check SHA256SUMS)
