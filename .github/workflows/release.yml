name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      distribute_tag:
        description: Existing published release to distribute to R2 (leave empty for Release Please)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: daylight-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.distribute_tag == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require a merged PR with successful exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -cer --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY"               '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .head.repo.full_name == $repo)] | if length == 1 then .[0] else error("one merged PR required") end')"
          head="$(printf '%s' "$pr" | jq -er '.head.sha')"
          for workflow in ci.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$head&per_page=100" |
              jq -e --arg sha "$head" '.workflow_runs | sort_by(.id) | last | .head_sha == $sha and .status == "completed" and .conclusion == "success"'
          done
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ github.token }}
          target-branch: main
      - name: Dispatch real checks on generated version PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(printf '%s' "$VERSION_PR" | jq -er '.headBranchName')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
  publish:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache: false
      - name: Require immutable checked release identity
        run: |
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$(cat version.txt)"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq '.sha')" = "$RELEASE_SHA"
          gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA"
      - name: Package both architectures with verified Caddy
        run: python3 scripts/package.py
      - name: Stage, read back and verify private release assets
        run: |
          gh release upload "$RELEASE_TAG" dist/*
          mkdir "$RUNNER_TEMP/readback"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/readback"
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/readback/$(basename "$file")"
          done
          (cd "$RUNNER_TEMP/readback" && sha256sum --check SHA256SUMS)
      - name: Distribute verified archives directly to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          command -v aws >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -cer --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("release identity is ambiguous") end' > "$RUNNER_TEMP/release-metadata.json"
          python3 scripts/publish_r2.py "$RELEASE_TAG" dist "$RUNNER_TEMP/release-metadata.json"
      - name: Publish only after complete verification
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_SHA"
  distribute:
    if: github.ref == 'refs/heads/main' && inputs.distribute_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.distribute_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require an existing published release from successful release CI
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-metadata.json"
          jq -e '.draft == false' "$RUNNER_TEMP/release-metadata.json" >/dev/null
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          jq -e --arg sha "$source_sha" '.target_commitish == $sha' "$RUNNER_TEMP/release-metadata.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$source_sha&per_page=100" |
            jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length > 0' >/dev/null
          mkdir "$RUNNER_TEMP/daylight-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/daylight-assets" --pattern '*.tar.gz' --pattern release.json --pattern SHA256SUMS
      - name: Copy verified release archives to R2 without rebuilding or replacing the release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          command -v aws >/dev/null
          python3 scripts/publish_r2.py "$RELEASE_TAG" "$RUNNER_TEMP/daylight-assets" "$RUNNER_TEMP/release-metadata.json"
